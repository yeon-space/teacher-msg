<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말투 변환기 시험</title>
<style>
  body{margin:0;background:#fbf7f2;color:#2b2622;font-family:system-ui,"Noto Sans KR",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#8a7f75;font-size:14px;margin:0 0 16px}
  .bar{display:flex;gap:8px;margin-bottom:16px}
  button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  #run{background:#e8846b;color:#fff}
  #copyAll{background:#2b2622;color:#fff}
  button:disabled{opacity:.5}
  .wrap{max-width:1400px}
  .tbl-wrap{overflow-x:auto;border:1px solid #ece4da;border-radius:14px;background:#fff}
  table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}
  th{background:#f5efe8;text-align:left;padding:10px;font-size:13px;position:sticky;top:0}
  td{border-top:1px solid #ece4da;padding:10px;vertical-align:top;line-height:1.6}
  td.n{width:28px;color:#8a7f75;font-weight:700}
  td.case-in{width:22%;color:#5a5048}
  td.case-in b{display:block;color:#e8846b;font-size:12px;margin-bottom:4px}
  td.res{width:30%;white-space:pre-wrap;font-size:14px}
  td textarea{box-sizing:border-box;width:100%;min-height:110px;border:1px solid #ece4da;border-radius:8px;padding:8px;font:inherit;font-size:13px;resize:vertical;background:#fffdfb}
  #paste{background:#fff;border:1px solid #2b2622;color:#2b2622}
  .pastebox{display:none;margin-bottom:14px}
  .pastebox textarea{box-sizing:border-box;width:100%;min-height:120px;border:1px solid #ece4da;border-radius:10px;padding:10px;font:inherit;font-size:13px}
  .case{background:#fff;border:1px solid #ece4da;border-radius:14px;padding:14px;margin-bottom:10px}
  .head{font-size:13px;color:#8a7f75;margin-bottom:6px}
  .in{font-size:13px;color:#6b6058;margin-bottom:8px;white-space:pre-wrap}
  .out{white-space:pre-wrap;line-height:1.7;font-size:15px;background:#fffdfb;border:1px dashed #ece4da;border-radius:10px;padding:10px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none}
  iframe{position:absolute;width:420px;height:900px;left:-9999px;top:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>말투 변환기 시험</h1>
  <p>① 시험 시작 → ② 전체 복사해서 Claude에게 보내기 → ③ Claude 피드백을 붙여 넣기 → ④ 내 피드백 쓰고 다시 전체 복사해서 보내기. 쓴 내용은 이 브라우저에 저장돼요.</p>
  <div class="bar">
    <button id="run">시험 시작</button>
    <button id="copyAll" disabled>전체 복사</button>
    <button id="paste">Claude 피드백 붙여넣기</button>
  </div>
  <div class="pastebox" id="pastebox">
    <textarea id="pasteText" placeholder="Claude가 준 번호별 피드백(1. … 2. …)을 통째로 붙여 넣으세요"></textarea>
    <button id="pasteApply" style="background:#e8846b;color:#fff;margin-top:6px">칸에 나눠 넣기</button>
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast">복사됐어요</div>
<iframe id="app" src="/"></iframe>

<script>
const CASES = [
  // 결석/지각
  { to:"어머니", kind:"결석", abs:"질병결석", name:"승연", recv:"선생님 승연이가 아침부터 열이 나서 오늘 결석할게요", draft:"ㅇㅋ" },
  { to:"어머니", kind:"결석", abs:"생리결석", name:"승연", recv:"승연이 오늘 생리통이 심해서 학교 못 갈 것 같아요", draft:"ㅇㅋ 서류 내일" },
  { to:"아버지", kind:"결석", abs:"", name:"승연", recv:"아이가 병원 들렀다가 2교시쯤 갈 것 같습니다", draft:"ㅇㅋ 진료확인서 챙겨오라고" },
  { to:"어머니", kind:"결석", abs:"질병결석", name:"승연", recv:"장염이라 이틀 정도 쉬어야 할 것 같아요", draft:"ㅇㅋ 수행평가 있는데 나중에 따로 보게 해줄게요" },
  { to:"어머니", kind:"결석", abs:"", name:"승연", recv:"늦잠 자서 지금 출발했어요 죄송해요", draft:"ㅇㅋ 조심히 오라고" },
  { to:"아버지", kind:"결석", abs:"", name:"승연", recv:"가족 행사로 금요일에 체험학습 신청하려고 합니다", draft:"신청서 3일전까지 내야함 양식 하이클래스에 있음" },
  { to:"학생", kind:"결석", abs:"질병결석", name:"승연", recv:"쌤 저 오늘 아파서 못가요ㅠ", draft:"ㅇㅋ 푹쉬어 병원 꼭 가" },
  { to:"학생", kind:"결석", abs:"", name:"승연", recv:"쌤 저 버스 놓쳐서 10분 늦을 것 같아요", draft:"ㅇㅋ 뛰지말고 조심히" },
  // 생활지도
  { to:"어머니", kind:"생활", name:"승연", recv:"", draft:"수업시간에 폰 계속 함 오늘 두번 걸림 집에서도 얘기좀" },
  { to:"아버지", kind:"생활", name:"승연", recv:"", draft:"쉬는시간에 친구랑 몸싸움 있었음 크게 다친 애는 없고 둘다 사과함" },
  { to:"어머니", kind:"생활", name:"승연", recv:"", draft:"요즘 지각 잦음 이번달 4번 아침에 좀 깨워주세요" },
  { to:"어머니", kind:"생활", name:"승연", recv:"", draft:"친구한테 욕한거 확인됨 사과는 함 학폭까지는 아님 집에서 지도부탁" },
  { to:"아버지", kind:"생활", name:"승연", recv:"", draft:"숙제 3주째 안냄 상담 한번 하고싶음 다음주 화요일 4시 가능?" },
  { to:"학생", kind:"생활", name:"승연", recv:"", draft:"복도에서 뛰다가 친구랑 부딪힘 다음부터 조심" },
  { to:"반 전체 학생", kind:"생활", name:"", recv:"", draft:"교실 쓰레기 너무 많음 청소 제대로 하자" },
  // 상담/민원
  { to:"어머니", kind:"상담", name:"승연", recv:"선생님 승연이가 반에서 따돌림 당하는 것 같다는데 알고 계셨나요? 너무 속상하네요", draft:"몰랐음 내일 애들 상담해보고 연락드림" },
  { to:"어머니", kind:"상담", name:"승연", recv:"수행평가 점수가 왜 이렇게 낮은지 궁금합니다", draft:"채점기준 미리 안내했음 보고서 분량 부족했음 다음주 상담 가능" },
  { to:"어머니", kind:"상담", name:"승연", recv:"왜 우리 아이만 혼내셨나요? 아이가 너무 억울해합니다", draft:"같이 떠든 애들 다 지도했음 승연이만 그런거 아님 오해 풀고싶음 통화 가능" },
  { to:"아버지", kind:"상담", name:"승연", recv:"자리 배치 바꿔주실 수 있나요? 옆 친구랑 사이가 안 좋다고 해서요", draft:"다음주 자리 바꿀 예정 그때 고려해볼게요" },
  { to:"어머니", kind:"상담", name:"승연", recv:"선생님 밤늦게 죄송해요 내일 준비물이 뭔가요?", draft:"체육복이랑 물 다음부턴 알림장 확인 부탁" },
  { to:"어머니", kind:"상담", name:"승연", recv:"아이가 요즘 학교 가기 싫다고 하는데 학교에서 무슨 일 있나요?", draft:"특별한건 못봤음 내일 따로 얘기해볼게요 걱정되시면 상담 가능" },
  { to:"학생", kind:"상담", name:"승연", recv:"쌤 저 요즘 친구들이랑 좀 힘들어요", draft:"점심시간에 상담실로 와 얘기하자" },
  // 안내
  { to:"어머니", kind:"안내", name:"승연", recv:"", draft:"수행평가 보고서 미제출 금요일까지 안내면 0점" },
  { to:"학생", kind:"안내", name:"승연", recv:"", draft:"오늘 발표 잘했음 굿" },
  { to:"반 전체 학생", kind:"안내", name:"", recv:"", draft:"금욜 현장체험학습 8시반 정문 집합 늦지마 도시락x" },
  { to:"반 전체 학생", kind:"안내", name:"", recv:"", draft:"다음주 월요일부터 중간고사 시간표 하이클래스에 올림 확인" },
  { to:"어머니", kind:"안내", name:"승연", recv:"", draft:"다음주 학부모 상담주간 신청서 내일까지" },
  { to:"아버지", kind:"안내", name:"승연", recv:"", draft:"승연이 이번에 봉사상 받음 축하드려요" },
  { to:"동료 선생님", kind:"안내", name:"", recv:"선생님 이번주 목요일 3교시 보강 들어가 주실 수 있으세요?", draft:"이번주 못들어감 미안 다음엔 내가 해줄게" },
  { to:"동료 선생님", kind:"안내", name:"", recv:"", draft:"회의자료 메일로 보냄 확인 부탁 수정할거 있으면 말해줘" }
];
const KIND_LABEL = { "결석":"결석/지각", "생활":"생활지도", "상담":"상담/민원", "안내":"안내" };
const TO_LABEL = { "어머니":"아이 어머니", "아버지":"아이 아버지", "학생":"학생", "반 전체 학생":"반 전체", "동료 선생님":"동료 선생님" };
const results = [];
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let fb = { claude:[], mine:[] };
try{ const saved = JSON.parse(localStorage.getItem("tm_test") || "null"); if(saved){ (saved.results||[]).forEach((r,i)=>results[i]=r); fb = saved.fb || fb; } }catch(e){}
function save(){ try{ localStorage.setItem("tm_test", JSON.stringify({ results, fb })); }catch(e){} }
const esc = t => String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
function render(){
  $("list").innerHTML = `<div class="tbl-wrap"><table>
    <tr><th>#</th><th>상황 · 입력</th><th>결과</th><th>Claude 피드백</th><th>내 피드백</th></tr>
    ${CASES.map((c,i) => { const r = results[i]; return `<tr>
      <td class="n">${i+1}</td>
      <td class="case-in"><b>${TO_LABEL[c.to]} · ${KIND_LABEL[c.kind]}${c.abs?" · "+c.abs:""}${r&&r.preset?"<br>"+esc(r.preset):""}</b>${c.recv?"받은: "+esc(c.recv)+"<br>":""}메모: ${esc(c.draft)}</td>
      <td class="res">${r ? esc(r.text) : '<span style="color:#b8ada2">대기 중</span>'}</td>
      <td><textarea data-k="claude" data-i="${i}">${esc(fb.claude[i])}</textarea></td>
      <td><textarea data-k="mine" data-i="${i}" placeholder="어색한 점, 이렇게 바꾸고 싶다 등">${esc(fb.mine[i])}</textarea></td>
    </tr>`; }).join("")}
  </table></div>`;
}
$("list").addEventListener("input", e => { const t = e.target; if(t.dataset.k){ fb[t.dataset.k][+t.dataset.i] = t.value; save(); } });
render();

async function runOne(doc, c){
  for(let a = 0; a < 3; a++){
    const r = await runOnce(doc, c);
    if(!/요청이 많아요|너무 늦어요/.test(r.text)) return r;
    await sleep(8000);
  }
  return await runOnce(doc, c);
}
async function runOnce(doc, c){
  const click = (box, pred) => { const b = [...doc.querySelectorAll(`#${box} button`)].find(pred); if(b) b.click(); };
  click("kind", b => b.dataset.v.startsWith(c.kind));
  click("to", b => b.dataset.v === c.to);
  if(c.kind === "결석") click("abs", b => b.dataset.v === (c.abs || ""));
  const set = (id, v) => { const el = doc.getElementById(id); el.value = v; el.dispatchEvent(new Event("input", {bubbles:true})); };
  set("student", c.name || ""); set("recv", c.recv || ""); set("draft", c.draft);
  await sleep(100);
  const preset = doc.getElementById("toneBadge").textContent;
  doc.getElementById("err").textContent = "";
  doc.getElementById("go").click();
  await sleep(300);
  const t0 = Date.now();
  while(doc.getElementById("go").disabled && Date.now() - t0 < 70000) await sleep(400);
  const err = doc.getElementById("err").textContent.trim();
  const text = err ? "[오류] " + err : doc.getElementById("result").textContent.trim();
  return { text, preset };
}

$("run").onclick = async () => {
  $("run").disabled = true; $("copyAll").disabled = true; results.length = 0; fb = { claude:[], mine:[] }; save(); render();
  const doc = $("app").contentDocument;
  for(let i = 0; i < CASES.length; i++){
    $("run").textContent = `진행 중 ${i+1}/${CASES.length}`;
    results[i] = await runOne(doc, CASES[i]);
    save(); render();
    await sleep(300);
  }
  $("run").textContent = "다시 시험"; $("run").disabled = false; $("copyAll").disabled = false;
};

if(results.length) $("copyAll").disabled = false;
$("paste").onclick = () => { const b = $("pastebox"); b.style.display = b.style.display === "block" ? "none" : "block"; };
$("pasteApply").onclick = () => {
  const txt = $("pasteText").value;
  const parts = txt.split(/\n(?=\s*\d{1,2}[.)]\s)/);
  parts.forEach(p => { const m = p.match(/^\s*(\d{1,2})[.)]\s*([\s\S]*)$/); if(m){ const i = +m[1]-1; if(i>=0 && i<CASES.length) fb.claude[i] = m[2].trim(); } });
  save(); render(); $("pastebox").style.display = "none"; $("pasteText").value = "";
};
$("copyAll").onclick = async () => {
  const txt = CASES.map((c,i) => { const r = results[i] || {}; return `${i+1}. ${TO_LABEL[c.to]} · ${KIND_LABEL[c.kind]}${c.abs?" · "+c.abs:""} · ${r.preset||""}\n${c.recv?"받은 메시지: "+c.recv+"\n":""}메모: ${c.draft}\n→ ${r.text||"(결과 없음)"}${fb.claude[i]?"\n[Claude] "+fb.claude[i]:""}${fb.mine[i]?"\n[내 피드백] "+fb.mine[i]:""}`; }).join("\n\n");
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  $("toast").style.display = "block"; setTimeout(() => $("toast").style.display = "none", 1500);
};
</script>
</body>
</html>
